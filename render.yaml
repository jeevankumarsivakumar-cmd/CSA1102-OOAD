services:
  - type: web
    name: student-attendance-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: DB_ENGINE
        value: auto
      - key: FLASK_DEBUG
        value: "false"
